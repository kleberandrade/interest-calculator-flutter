name: interest_calculator
description: An educational overdue payment slip calculator with exact compound interest.
publish_to: none
version: 2.0.0+2

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Patch upgrades ahead of Flutter 3.50.0's SDK pins.
# Validated by this application's tests/builds; remove when the SDK catches up.
dependency_overrides:
  material_color_utilities: 0.13.1
  test_api: 0.7.15
