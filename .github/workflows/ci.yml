name: Flutter CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - run: flutter analyze
      - run: flutter test --coverage
      - run: dart run tool/lesson_example.dart
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-build-and-coverage
          path: |
            build/web
            coverage/lcov.info
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned iOS release
        run: flutter build ios --release --no-codesign
      - name: Boot dedicated iOS simulator
        run: |
          device_id=$(xcrun simctl create InterestCalculatorCI com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-26-5)
          echo "IOS_SIMULATOR_UDID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
      - name: Test calculator on iOS
        run: flutter test integration_test/calculator_test.dart -d "$IOS_SIMULATOR_UDID"
      - name: Remove dedicated simulator
        if: always() && env.IOS_SIMULATOR_UDID != ''
        run: |
          xcrun simctl shutdown "$IOS_SIMULATOR_UDID" || true
          xcrun simctl delete "$IOS_SIMULATOR_UDID"
